<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Conecta Futuro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* ===== HEADER ===== */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.35rem;
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
    }
    .logo span {
      color: #f1f5f9;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }
    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    nav a:hover {
      color: #38bdf8;
    }
    .btn-nav {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white !important;
      padding: 0.55rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
    }
    .btn-nav:hover {
      opacity: 0.9;
    }
    /* ===== AUTH ===== */
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .auth-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .auth-container h2 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 1.75rem;
      color: #f1f5f9;
      text-align: center;
    }
    .auth-container form > div {
      margin-bottom: 1.25rem;
    }
    .auth-container label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .auth-container input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-container input:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
    }
    .auth-container input::placeholder {
      color: #64748b;
    }
    .password-field {
      position: relative;
    }
    .password-field input {
      padding-right: 3.25rem;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transform: translateY(-50%);
    }
    .password-toggle:hover {
      color: #38bdf8;
    }
    .password-toggle:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
      border-radius: 4px;
    }
    .password-toggle svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    .password-toggle[aria-pressed="true"] .icon-eye {
      display: none;
    }
    .password-toggle[aria-pressed="false"] .icon-eye-off {
      display: none;
    }
    .auth-container button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      padding: 0.95rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .auth-container button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.35);
    }
    .login-link {
      text-align: center;
      margin-top: 1.75rem;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .login-link a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    footer {
      border-top: 1px solid #1e293b;
      padding: 1.5rem;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
    }
    @media (max-width: 480px) {
      .auth-container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">⚡ <span>Conecta Futuro</span></a>
      <nav>
        <a href="index.html">Início</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <!-- CADASTRO -->
  <div class="auth-wrapper">
    <main class="auth-container">
      <h2>Criar Conta</h2>

      <form id="formCadastro">
        <div>
          <label for="nome">Nome Completo:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
          >
        </div>

        <div>
          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            required
          >
        </div>

        <div>
          <label for="senha">Senha:</label>
          <div class="password-field">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              minlength="6"
              required
            >
            <button class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="senha" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.8-.5"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label for="confirmarSenha">Confirmar Senha:</label>
          <div class="password-field">
            <input
              type="password"
              id="confirmarSenha"
              name="confirmarSenha"
              placeholder="Confirme sua senha"
              required
            >
            <button class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="confirmarSenha" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.8-.5"/></svg>
            </button>
          </div>
        </div>

        <button type="submit">Cadastrar</button>
      </form>

      <p class="login-link">
        Já possui uma conta?
        <a href="login.html">Faça login</a>
      </p>
    </main>
  </div>

  <footer>
    <p>© 2026 Conecta Futuro • Projeto de Extensão • Análise e Desenvolvimento de Sistemas</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
