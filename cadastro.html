<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <style>
    /* =========================================
       ESTILOS GLOBAIS (Baseado no seu tema)
    ========================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0152;
      color: #ffffff;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* Detalhe de fundo radial idêntico ao Hero do seu layout */
      background:
        radial-gradient(circle at 15% 30%, rgba(84, 55, 255, 0.35), transparent 35%),
        radial-gradient(circle at 85% 60%, rgba(0, 140, 255, 0.18), transparent 30%),
        #0a0152;
    }

    a {
      text-decoration: none;
      color: #ffd21f;
      transition: 0.3s;
    }

    a:hover {
      color: #ffdc45;
      text-decoration: underline;
    }

    button {
      font-family: inherit;
    }

    /* =========================================
       CONTAINER DO CADASTRO (Estilo Card/Modal)
    ========================================= */
    .cadastro-container {
      width: min(480px, 100%);
      padding: 40px;
      border-radius: 25px;
      background: #10066c;
      border: 1px solid rgba(117, 92, 255, 0.5);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    h2 {
      font-size: 32px;
      margin-bottom: 25px;
      font-weight: 800;
      text-align: center;
      letter-spacing: -1px;
    }

    /* =========================================
       FORMULÁRIO E CAMPOS
    ========================================= */
    form div {
      margin-bottom: 15px;
    }

    label {
      display: inline-block;
      color: #d5d2f7;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input::placeholder {
      color: #8985b5;
    }

    input:focus {
      border-color: rgba(110, 90, 255, 0.8);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px rgba(80, 80, 255, 0.25);
    }

    /* =========================================
       BOTÃO (Padrão .btn-primary)
    ========================================= */
    button[type="submit"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 25px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      border: none;
      color: white;
      background: linear-gradient(135deg, #573cff, #267dff);
      box-shadow: 0 10px 30px rgba(67, 59, 255, 0.35);
      transition: 0.3s;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(67, 59, 255, 0.5);
    }

    /* =========================================
       RODAPÉ DO FORMULÁRIO (Texto Login)
    ========================================= */
    .login-link {
      text-align: center;
      margin-top: 25px;
      color: #c2bedf;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="cadastro-container">
    <h2>Criar Conta</h2>
    
    <form action="#" method="POST">
      <div>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6" required>
      </div>

      <div>
        <label for="confirmarSenha">Confirmar Senha:</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required>
      </div>

      <button type="submit">Cadastrar</button>
    </form>

    <p class="login-link">
      Já possui uma conta? <a href="#">Faça login</a>
    </p>
  </div>

</body>
</html>
