<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <main class="auth-container">
    <h2>Criar Conta</h2>
    
    <form action="#" method="POST">
      <div>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6" required>
      </div>

      <div>
        <label for="confirmarSenha">Confirmar Senha:</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required>
      </div>

      <button type="submit">Cadastrar</button>
    </form>

    <p class="login-link">
      Já possui uma conta? <a href="login.html">Faça login</a>
    </p>
  </main>

</body>
</html>
