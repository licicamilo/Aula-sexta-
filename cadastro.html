<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-container">
        <h2>Crie sua conta</h2>
        <p class="auth-description">Preencha os dados abaixo para se cadastrar</p>

        <form action="#" method="POST">
            <div>
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div>
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Crie uma senha" required>
            </div>

            <div>
                <label for="confirm-password">Confirmar senha</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita a senha" required>
            </div>

            <div class="auth-options">
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms" required> Concordo com os <a href="#">Termos de Uso</a>
                </label>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <p class="login-link">Já tem uma conta? <a href="login.html">Faça login</a></p>
    </main>
</body>
</html>
