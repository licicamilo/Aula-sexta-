<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro e Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #007bff, #004aad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            color: #007bff;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .formulario {
            display: none;
        }

        .formulario.ativo {
            display: block;
        }

        .campo {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .link a {
            color: #007bff;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .mensagem {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .sucesso {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .erro {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        .usuario-logado {
            display: none;
            text-align: center;
        }

        .usuario-logado h2 {
            color: #007bff;
        }

        .usuario-logado p {
            margin: 10px 0;
            color: #555;
        }

        .btn-sair {
            background: #dc3545;
        }

        .btn-sair:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Meu Site
        </div>

        <!-- LOGIN -->
        <div id="login" class="formulario ativo">

            <h2>Entrar</h2>

            <form id="formLogin">

                <div class="campo">
                    <label for="loginEmail">E-mail</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="seuemail@exemplo.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="loginSenha">Senha</label>

                    <input
                        type="password"
                        id="loginSenha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div id="mensagemLogin" class="mensagem"></div>

            <p class="link">
                Ainda não possui uma conta?
                <a onclick="mostrarCadastro()">Criar conta</a>
            </p>

        </div>


        <!-- CADASTRO -->
        <div id="cadastro" class="formulario">

            <h2>Criar Conta</h2>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                    >
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="000.000.000-00"
                    >
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento</label>

                    <input
                        type="date"
                        id="nascimento"
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        minlength="6"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Confirme sua senha"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <div id="mensagemCadastro" class="mensagem"></div>

            <p class="link">
                Já possui uma conta?
                <a onclick="mostrarLogin()">Fazer login</a>
            </p>

        </div>


        <!-- ÁREA DO USUÁRIO -->
        <div id="usuarioLogado" class="usuario-logado">

            <h2>Bem-vindo!</h2>

            <p id="nomeUsuario"></p>

            <p>
                Você está conectado à sua conta.
            </p>

            <button
                class="btn-sair"
                onclick="sair()"
            >
                Sair
            </button>

        </div>

    </div>


    <script>

        // Mostrar cadastro
        function mostrarCadastro() {

            document.getElementById("login")
                .classList.remove("ativo");

            document.getElementById("cadastro")
                .classList.add("ativo");

            limparMensagens();
        }


        // Mostrar login
        function mostrarLogin() {

            document.getElementById("cadastro")
                .classList.remove("ativo");

            document.getElementById("login")
                .classList.add("ativo");

            limparMensagens();
        }


        // Limpar mensagens
        function limparMensagens() {

            document.getElementById("mensagemLogin")
                .className = "mensagem";

            document.getElementById("mensagemCadastro")
                .className = "mensagem";

            document.getElementById("mensagemLogin")
                .textContent = "";

            document.getElementById("mensagemCadastro")
                .textContent = "";
        }


        // Cadastro
        document.getElementById("formCadastro")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const nome =
                    document.getElementById("nome").value;

                const email =
                    document.getElementById("email").value;

                const telefone =
                    document.getElementById("telefone").value;

                const cpf =
                    document.getElementById("cpf").value;

                const nascimento =
                    document.getElementById("nascimento").value;

                const senha =
                    document.getElementById("senha").value;

                const confirmarSenha =
                    document.getElementById("confirmarSenha").value;


                // Verificar senhas
                if (senha !== confirmarSenha) {

                    mostrarMensagem(
                        "mensagemCadastro",
                        "As senhas não são iguais.",
                        "erro"
                    );

                    return;
                }


                // Verificar se já existe
                const usuarioExistente =
                    localStorage.getItem("usuario");

                if (usuarioExistente) {

                    const usuario =
                        JSON.parse(usuarioExistente);

                    if (usuario.email === email) {

                        mostrarMensagem(
                            "mensagemCadastro",
                            "Este e-mail já está cadastrado.",
                            "erro"
                        );

                        return;
                    }
                }


                // Criar usuário
                const usuario = {

                    nome: nome,
                    email: email,
                    telefone: telefone,
                    cpf: cpf,
                    nascimento: nascimento,
                    senha: senha

                };


                // Salvar no navegador
                localStorage.setItem(
                    "usuario",
                    JSON.stringify(usuario)
                );


                mostrarMensagem(
                    "mensagemCadastro",
                    "Cadastro realizado com sucesso!",
                    "sucesso"
                );


                // Limpar formulário
                document.getElementById("formCadastro").reset();


                // Ir para login depois de 1 segundo
                setTimeout(function() {

                    mostrarLogin();

                }, 1000);

            });


        // Login
        document.getElementById("formLogin")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("loginEmail").value;

                const senha =
                    document.getElementById("loginSenha").value;


                const usuarioSalvo =
                    localStorage.getItem("usuario");


                if (!usuarioSalvo) {

                    mostrarMensagem(
                        "mensagemLogin",
                        "Nenhuma conta cadastrada.",
                        "erro"
                    );

                    return;
                }


                const usuario =
                    JSON.parse(usuarioSalvo);


                // Conferir login
                if (
                    email === usuario.email &&
                    senha === usuario.senha
                ) {

                    document.getElementById("login")
                        .classList.remove("ativo");

                    document.getElementById("cadastro")
                        .classList.remove("ativo");

                    document.getElementById("usuarioLogado")
                        .style.display = "block";

                    document.getElementById("nomeUsuario")
                        .textContent =
                        "Olá, " + usuario.nome + "!";

                } else {

                    mostrarMensagem(
                        "mensagemLogin",
                        "E-mail ou senha incorretos.",
                        "erro"
                    );

                }

            });


        // Sair
        function sair() {

            document.getElementById("usuarioLogado")
                .style.display = "none";

            document.getElementById("login")
                .classList.add("ativo");

            document.getElementById("formLogin")
                .reset();

        }


        // Mostrar mensagem
        function mostrarMensagem(
            elemento,
            texto,
            tipo
        ) {

            const mensagem =
                document.getElementById(elemento);

            mensagem.textContent = texto;

            mensagem.className =
                "mensagem " + tipo;

        }

    </script>

</body>
</html>
</body>
</html>
